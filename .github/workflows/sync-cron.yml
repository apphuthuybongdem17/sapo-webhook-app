name: Sync Inventory Cron

on:
  schedule:
    # Chạy mỗi 5 phút (GitHub Actions — miễn phí)
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sapo-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Sapo inventory sync (Production)
        env:
          CRON_SECRET: ${{ secrets.SAPO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret SAPO_WEBHOOK_SECRET"
            exit 1
          fi
          response=$(curl -sfS -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://sapo-webhook-app.vercel.app/api/cron/sync-inventory")
          echo "$response"
          echo "Sync triggered successfully"
