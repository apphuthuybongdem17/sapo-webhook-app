name: Sync Inventory Cron

on:
  schedule:
    # GitHub có thể trễ 5–15 phút so với lịch; workflow_dispatch để chạy ngay
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sapo-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Sapo inventory sync
        run: |
          echo "Trigger at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          response=$(curl -sfS -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer f604680fdf364f8b91a0b66b71685704" \
            "https://sapo-webhook-app.vercel.app/api/cron/sync-inventory")
          echo "$response"
